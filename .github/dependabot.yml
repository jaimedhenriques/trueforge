  - package-ecosystem: npm
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
    # Fern-generated; maintainers regenerate rather than hand-bump deps.
    exclude-paths:
      - packages/trueforge-sdk/**
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - '*'
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: helm
    open-pull-requests-limit: 0
    directory: /charts/trueforge
    schedule:
      interval: weekly
    groups:
      helm:
        patterns:
          - '*'

  - package-ecosystem: pip
    open-pull-requests-limit: 0
    directory: /benchmark
    schedule:
      interval: weekly
    groups:
      pip:
        patterns:
          - '*'
